# @package _global_
# Stage B of the Quest teleop policy (PLAN.md D14): sonic_r1_dex3_teleop plus the robustness terms
# the sim-to-real literature puts before a real-robot demo. Fine-tune from a Stage A2 checkpoint
# and compare its eval/ metrics with A2's.
#
#  * Leg/waist/ankle armature measured on a real R1 (unitree_rl_mjlab issue #51, one robot, hanging
#    unloaded): legs and waist 0.05, ankles 0.10 instead of Unitree's 0.01 placeholder, +-30 %
#    (one measured robot; ours may differ).
#  * Joint Coulomb friction from the same fit (MuJoCo frictionloss, N m): legs, waist and shoulder
#    pitch/roll 2.5, ankles 1.5, shoulder yaw / elbow / wrist roll 0.2, x0.75-2.0 (#51 randomizes
#    x1.0-2.0: unloaded backdriving is a lower bound for loaded legs). Written as Isaac Sim 5
#    static = dynamic friction efforts (joint_friction.py); the iteration-1 eval shows whether they
#    act as torques (a unitless coefficient x joint reaction force would lock the legs).
#  * PD gains x0.9-1.1 (KungfuBot 2506.12851; ASAP 2502.01143 uses x0.925-1.05).
#  * Actuation latency 0-20 ms (delayed_actions.py; OmniH2O / HOVER / ASAP / GMT / CLONE): the Python
#    runtime adds state read + inference + a 500 Hz command writer to the motor bus latency.
#  * Uniform eval every 1000 iterations: with S1 and planner v3 (~2k clips) one eval takes ~7 min.

defaults:
  - manager/universal_token/all_modes/sonic_r1_dex3_teleop

manager_env:
  actions:
    joint_pos:
      _target_: gear_sonic.envs.manager_env.mdp.delayed_actions.DelayedJointPositionActionCfg
      delay_substeps_range: [0, 4]

  events:
    _target_: gear_sonic.envs.manager_env.mdp.r1_events.R1RobustEventCfg  # fields for the terms below
    r1_leg_armature:
      _target_: isaaclab.managers.EventTermCfg
      func: isaaclab.envs.mdp:randomize_joint_parameters
      mode: "startup"
      params:
        asset_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: "robot"
          joint_names: [".*_hip_.*_joint", ".*_knee_joint", "waist_.*_joint"]
        armature_distribution_params: [0.035, 0.065]
        operation: "abs"
    r1_ankle_armature:
      _target_: isaaclab.managers.EventTermCfg
      func: isaaclab.envs.mdp:randomize_joint_parameters
      mode: "startup"
      params:
        asset_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: "robot"
          joint_names: [".*_ankle_.*_joint"]
        armature_distribution_params: [0.07, 0.13]
        operation: "abs"
    r1_joint_friction:
      _target_: isaaclab.managers.EventTermCfg
      func: gear_sonic.envs.manager_env.mdp.joint_friction:randomize_joint_friction_torque
      mode: "startup"
      params:
        asset_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: "robot"
        torque:
          ".*_hip_.*_joint": 2.5
          ".*_knee_joint": 2.5
          "waist_.*_joint": 2.5
          ".*_ankle_.*_joint": 1.5
          ".*_shoulder_(pitch|roll)_joint": 2.5
          ".*_shoulder_yaw_joint": 0.2
          ".*_elbow_joint": 0.2
          ".*_wrist_roll_joint": 0.2
        scale_range: [0.75, 2.0]
    actuator_gains:
      _target_: isaaclab.managers.EventTermCfg
      func: isaaclab.envs.mdp:randomize_actuator_gains
      mode: "startup"
      params:
        asset_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: "robot"
          joint_names: [".*"]
        stiffness_distribution_params: [0.9, 1.1]
        damping_distribution_params: [0.9, 1.1]
        operation: "scale"

callbacks:
  periodic_eval:
    eval_frequency: 1000
