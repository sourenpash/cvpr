# @package _global_
# SONIC for Unitree R1 (24 DOF) + Dex3-1 hands, teleop only (PLAN.md D13): a Meta Quest drives the
# robot through SONIC's VR 3-point encoder (head + two hands) with the lower body from a locomotion
# command (SONIC's VR_3PT mode: kinematic planner legs + VR upper body). Only the teleop encoder
# and the action decoder are built: no robot-motion or SMPL encoder, no kinematic decoder, no
# latent-alignment losses, no SMPL data. Everything embodiment-specific is sonic_r1_dex3.yaml's
# (tests assert the two presets agree with r1_spec.py).
#
# Data: ++manager_env.commands.motion.motion_lib_cfg.motion_file=data/motion_lib_r1/S0
# Warm start: checkpoint=<an sonic_r1_dex3 or r1_init checkpoint> (policy loads with strict=False).

defaults:
  - /algo: ppo_im_phc
  - /manager_env: base_env
  - /callbacks/read_eval
  - /callbacks/im_resample
  - /callbacks/rollout_video # W&B videos: reference | policy, palm targets (BruteForce format)
  - /callbacks/periodic_eval # every 500 it: all clips once, success rate/MPJPE -> W&B eval/
  - override /trainer: trl_ppo_aux
  - override /actor_critic: universal_token/teleop_mlp_v1
  - override /manager_env/observations/tokenizer: unitoken_teleop_heading
  - override /manager_env/observations/policy: local_dir_hist
  - override /manager_env/observations/critic: privileged_mf_hist
  - override /manager_env/events: tracking/level0_4
  - override /manager_env/terminations: tracking/base_adaptive_strict_ori_foot_xyz
  - override /manager_env/rewards: tracking/local_feet_acc_energy_5pt

use_manager_env: true

exp_base: ${hydra:runtime.choices.exp}
exp_var: test
experiment_name: ${exp_base}_${exp_var}
experiment_dir: ${base_dir}/${project_name}/${experiment_name}-${timestamp}

num_envs: 4096
project_name: TRL_R1_Track
use_wandb: true
wandb_sync_tensorboard: false # metrics are logged directly by WandbCallback
wandb:
  wandb_entity: sourenpashangpour-university-of-toronto
  wandb_group: r1_dex3_teleop
  wandb_dir: ${base_dir}/wandb

actor_prop_history_length: 10
actor_actions_history_length: 10
critic_prop_history_length: 10
critic_actions_history_length: 10

manager_env:
  config:
    robot:
      type: r1_dex3
    terrain_type: trimesh

  rewards:
    feet_acc:
      weight: -2.5e-6
    anti_shake_ang_vel:
      params:
        body_names: ["left_wrist_roll_link", "right_wrist_roll_link", "torso_link"]
    tracking_vr_2wrists_local_ori:
      params:
        body_names: ["left_wrist_roll_link", "right_wrist_roll_link"]
    undesired_contacts:
      params:
        sensor_cfg:
          body_names:
            - "^(?!left_ankle_roll_link$)(?!right_ankle_roll_link$)(?!left_wrist_roll_link$)(?!right_wrist_roll_link$)(?!left_elbow_link$)(?!right_elbow_link$)(?!left_hand_.*)(?!right_hand_.*).+$"

  terminations:
    ee_body_pos:
      params:
        body_names:
          - "left_ankle_roll_link"
          - "right_ankle_roll_link"
          - "left_wrist_roll_link"
          - "right_wrist_roll_link"

  events:
    randomize_rigid_body_mass:
      params:
        asset_cfg:
          body_names: ".*wrist_roll.*|torso_link"

  commands:
    motion:
      # Hand grasp point = wrist_roll_link + Dex3 mount (0.080) + G1-equivalent 0.1385 beyond palm base.
      vr_3point_body: ["left_wrist_roll_link", "right_wrist_roll_link", "torso_link"]
      vr_3point_body_offset: [[0.2185, -0.025, 0.0], [0.2185, 0.025, 0.0], [0.0, 0.0, 0.32]]
      reward_point_body: ["torso_link", "left_wrist_roll_link", "right_wrist_roll_link"]
      reward_point_body_offset: [[0.0, 0.0, 0.45], [0.2185, -0.025, 0.0], [0.2185, 0.025, 0.0]]
      body_names:
        [
          "pelvis",
          "left_hip_roll_link",
          "left_knee_link",
          "left_ankle_roll_link",
          "right_hip_roll_link",
          "right_knee_link",
          "right_ankle_roll_link",
          "torso_link",
          "left_shoulder_roll_link",
          "left_elbow_link",
          "left_wrist_roll_link",
          "right_shoulder_roll_link",
          "right_elbow_link",
          "right_wrist_roll_link",
        ]
      num_future_frames: 10
      dt_future_ref_frames: 0.1
      cat_upper_body_poses: true
      cat_upper_body_poses_prob: 0.5
      freeze_frame_aug: true
      randomize_wrist_poses: true

      motion_lib_cfg:
        robot_type: r1_dex3
        # MuJoCo DOF indices of the wrist joints for randomize_wrist_poses (R1: wrist roll only).
        wrist_mujoco_dof_indices: [18, 23]
        adaptive_sampling:
          adp_samp_failure_rate_max_over_mean: 200
        motion_file: null # REQUIRED on the command line (R1 motion_lib PKL directory)
        smpl_motion_file: dummy # no SMPL encoder
        asset:
          assetFileName: "r1_dex3.xml"

algo:
  config:
    empty_cache_every_n_ppo_epoch: -1
    num_steps_per_env: 24
    use_clampped_std: true
    std_clamp_min: 0.001
    std_clamp_max: 0.5
    max_grad_norm: 0.1
    actor:
      backbone:
        encoders:
          teleop:
            inputs:
              [
                "command_multi_future_lower_body",
                "vr_3point_local_target",
                "vr_3point_local_orn_target",
                "motion_anchor_ori_heading",
              ]
        decoders:
          g1_dyn:
            params:
              module_config_dict:
                layer_config:
                  hidden_dims: [4096, 4096, 2048, 2048, 1024, 1024, 512, 512]

    critic:
      backbone:
        module_config_dict:
          layer_config:
            hidden_dims: [4096, 4096, 2048, 2048, 1024, 1024, 512, 512]
