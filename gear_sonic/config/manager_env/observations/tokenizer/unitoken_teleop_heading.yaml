# Teleop-only tokenizer observations (VR 3-point: head + two hands, plus the lower-body command),
# robot-heading-normalized. The inputs of the teleop encoder in unitoken_all_noz_heading, without
# the robot-motion and SMPL encoders' terms.

defaults:
  - ../terms/encoder_index@_here_
  - ../terms/command_multi_future_lower_body@_here_
  - ../terms/vr_3point_local_target@_here_
  - ../terms/vr_3point_local_orn_target@_here_
  - ../terms/motion_anchor_ori_heading@_here_

_target_: gear_sonic.envs.manager_env.mdp.observations.TokenizerCfg
enable_corruption: true
concatenate_terms: false

motion_anchor_ori_heading:
  noise:
    _target_: isaaclab.utils.noise.AdditiveUniformNoiseCfg
    n_min: -0.05
    n_max: 0.05

# Headset/controller tracking jitter and calibration error (CLONE 2506.08931 perturbs the VR
# head target; OmniH2O 2406.08858 randomizes teleop input): small per-step noise on the 3 points.
vr_3point_local_target:
  noise:
    _target_: isaaclab.utils.noise.AdditiveUniformNoiseCfg
    n_min: -0.01
    n_max: 0.01

vr_3point_local_orn_target:
  noise:
    _target_: isaaclab.utils.noise.AdditiveUniformNoiseCfg
    n_min: -0.02
    n_max: 0.02
